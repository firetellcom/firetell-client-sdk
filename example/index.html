<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Firetell WebRTC Client — SDK Demo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script src="../dist/index.global.js"></script>
    <link rel="stylesheet" href="style.css" />
    <style>
      .agent-call-btn {
        background: var(--border);
        border: none;
        color: var(--text);
        padding: 2px 6px;
        font-size: 9px;
        border-radius: 10px;
        margin-left: 6px;
        cursor: pointer;
        transition: background 0.2s, transform 0.1s;
      }
      .agent-call-btn:hover {
        background: var(--primary);
        color: #fff;
        transform: scale(1.05);
      }
      .agent-call-btn:active {
        transform: scale(0.95);
      }
    </style>
  </head>

  <body>
    <div class="app">
      <!-- ── Header ──────────────────────── -->
      <div class="header">
        <h1>🔥 Firetell WebRTC Example</h1>
        <span class="badge" id="sdkVersion">SDK v—</span>
      </div>

      <!-- ── Login Card ──────────────────── -->
      <div id="loginCard" class="card">
        <div class="card-title">Authentication</div>
        <input
          type="text"
          id="tokenInput"
          placeholder="Paste your JWT token here…"
          style="width: 100%; margin-bottom: 10px"
        />
        <input
          type="text"
          id="baseUrlInput"
          placeholder="Workspace domain"
          value=""
          style="width: 100%; margin-bottom: 12px"
        />
        <button
          class="btn btn-primary"
          style="width: 100%"
          onclick="initClient()"
        >
          Connect
        </button>
      </div>

      <!-- ── Session Card ────────────────── -->
      <div id="sessionCard" class="card hidden">
        <div class="card-title">Session</div>
        <div class="status-bar">
          <div class="status-dot" id="connStatusDot"></div>
          <span id="connStatusText">Connecting…</span>
        </div>
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
          "
        >
          <div>
            <div style="font-weight: 600; font-size: 15px" id="displayName">
              —
            </div>
            <div class="text-muted" id="sessionMeta">—</div>
          </div>
          <button class="btn btn-ghost btn-sm" onclick="logout()">
            Logout
          </button>
        </div>
      </div>

      <!-- ── Agents Card ─────────────────── -->
      <div id="agentsCard" class="card hidden">
        <div class="card-title">Agents Online</div>
        <div class="agent-list" id="agentList">
          <span class="text-muted">No agents online</span>
        </div>
      </div>

      <!-- ── Dialer Card ─────────────────── -->
      <div id="dialerCard" class="card hidden">
        <div class="card-title">Make a Call</div>
        <div class="input-group">
          <input
            type="text"
            id="calleeInput"
            placeholder="Number or username…"
          />
          <button class="btn btn-green" id="callBtn" onclick="makeCall()">
            📞 Call
          </button>
          <button
            class="btn btn-primary"
            id="videoCallBtn"
            onclick="makeCall(true)"
          >
            🎥
          </button>
        </div>
        <div class="input-group mt-8">
          <input
            type="text"
            id="callerIdInput"
            placeholder="Caller ID (optional for external)"
          />
        </div>
      </div>

      <!-- ── Active Call Card ────────────── -->
      <div id="callCard" class="card hidden">
        <div class="card-title">Active Call</div>
        <div class="call-info">
          <div class="caller-name" id="callPeer">—</div>
          <div class="call-status" id="callStatus">—</div>
          <div class="call-timer" id="callTimer">00:00</div>
        </div>

        <!-- Call Controls -->
        <div class="call-controls">
          <div style="position: relative">
            <button
              class="btn btn-icon btn-ghost"
              id="muteBtn"
              onclick="toggleMute()"
              disabled
            >
              🎤
            </button>
            <span class="btn-label">Mute</span>
          </div>
          <div style="position: relative">
            <button
              class="btn btn-icon btn-ghost"
              id="holdBtn"
              onclick="toggleHold()"
              disabled
            >
              ⏸️
            </button>
            <span class="btn-label">Hold</span>
          </div>
          <div style="position: relative">
            <button
              class="btn btn-icon btn-ghost"
              id="dtmfToggleBtn"
              onclick="toggleDtmfPad()"
            >
              #️⃣
            </button>
            <span class="btn-label">DTMF</span>
          </div>
        </div>

        <!-- DTMF Pad -->
        <div class="dtmf-pad hidden" id="dtmfPad">
          <button class="btn btn-ghost" onclick="sendDtmf('1')">1</button>
          <button class="btn btn-ghost" onclick="sendDtmf('2')">2</button>
          <button class="btn btn-ghost" onclick="sendDtmf('3')">3</button>
          <button class="btn btn-ghost" onclick="sendDtmf('4')">4</button>
          <button class="btn btn-ghost" onclick="sendDtmf('5')">5</button>
          <button class="btn btn-ghost" onclick="sendDtmf('6')">6</button>
          <button class="btn btn-ghost" onclick="sendDtmf('7')">7</button>
          <button class="btn btn-ghost" onclick="sendDtmf('8')">8</button>
          <button class="btn btn-ghost" onclick="sendDtmf('9')">9</button>
          <button class="btn btn-ghost" onclick="sendDtmf('*')">*</button>
          <button class="btn btn-ghost" onclick="sendDtmf('0')">0</button>
          <button class="btn btn-ghost" onclick="sendDtmf('#')">#</button>
        </div>

        <!-- Transfer -->
        <div class="transfer-row">
          <input
            type="text"
            id="transferTarget"
            placeholder="Transfer to (username)…"
          />
          <button class="btn btn-ghost btn-sm" onclick="transferCall()">
            🔀 Transfer
          </button>
        </div>

        <!-- Hangup -->
        <div class="call-actions">
          <button class="btn btn-icon btn-lg btn-red" onclick="hangup()">
            📵
          </button>
        </div>
      </div>

      <!-- ── Log Card ────────────────────── -->
      <div class="card">
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
          "
        >
          <div class="card-title" style="margin: 0">Event Log</div>
          <button
            class="btn btn-ghost btn-sm"
            onclick="clearLogs()"
            style="padding: 4px 10px; font-size: 11px"
          >
            Clear
          </button>
        </div>
        <div class="log-panel" id="logPanel"></div>
      </div>

      <!-- ── Incoming Call Banner ────────── -->
      <div class="incoming-banner" id="incomingBanner">
        <div class="caller" id="incomingCaller">Unknown</div>
        <div class="sub" id="incomingSub">Incoming call</div>
        <div class="actions">
          <button class="btn btn-green btn-sm" onclick="acceptIncoming()">
            ✅ Accept
          </button>
          <button class="btn btn-red btn-sm" onclick="rejectIncoming()">
            ❌ Decline
          </button>
        </div>
      </div>

      <!-- Hidden audio elements -->
      <audio id="localAudio" autoplay muted></audio>
      <audio id="remoteAudio" autoplay></audio>
    </div>

    <script>
      // ═══════════════════════════════════════
      // State
      // ═══════════════════════════════════════
      let client = null;
      let activeCall = null;
      let incomingCall = null;
      let callTimerInterval = null;
      let callStartTime = null;
      const agents = new Map(); // username → state

      // Ringtone
      const ringtone = new Audio("ringtone-025.mp3");
      ringtone.loop = true;

      function startRingtone() {
        if (ringtone.paused) {
          ringtone.currentTime = 0;
          ringtone.play().catch((err) => {
            console.warn("Ringtone play blocked by browser security/interaction policy:", err.message);
          });
        }
      }

      function stopRingtone() {
        ringtone.pause();
        ringtone.currentTime = 0;
      }

      // ═══════════════════════════════════════
      // Init & Connect
      // ═══════════════════════════════════════
      async function initClient() {
        const token = document.getElementById("tokenInput").value.trim();
        const baseUrl = document.getElementById("baseUrlInput").value.trim();

        if (!token) {
          log("Token is required", "error");
          return;
        }
        if (!baseUrl) {
          log("Workspace domain is required", "error");
          return;
        }

        try {
          client = new Firetell.FiretellClient(token, baseUrl);
          document.getElementById("sdkVersion").textContent =
            `SDK v${client.sdkVersion}`;

          log(`Initializing client (Device ID: ${client.getDeviceId()})…`, "info");
          setupClientEvents();

          const session = await client.ready;
          log(`Authenticated as ${session.username}`, "success");

          // Save credentials to local storage
          localStorage.setItem("firetell_jwt", token);
          localStorage.setItem("firetell_domain", baseUrl);

          setConnectionStatus("online", "Connected");
          document.getElementById("displayName").textContent =
            session.display_name || session.username;
          document.getElementById("sessionMeta").textContent =
            `${session.username}@${session.domain}` +
            (session.ext ? ` • ext ${session.ext}` : "");

          show("sessionCard");
          show("dialerCard");
          show("agentsCard");
          hide("loginCard");
        } catch (error) {
          log(`Init failed: ${error.message}`, "error");
        }
      }

      function setupClientEvents() {
        // Session
        client.events.on("session", (session) => {
          if (session) {
            setConnectionStatus("online", "Connected");
            document.getElementById("displayName").textContent =
              session.display_name || session.username;
            document.getElementById("sessionMeta").textContent =
              `${session.username}@${session.domain}` +
              (session.ext ? ` • ext ${session.ext}` : "");

            show("sessionCard");
            show("dialerCard");
            show("agentsCard");
            hide("loginCard");
            fetchAgents();
          } else {
            setConnectionStatus("error", "Disconnected");
            hide("sessionCard");
            hide("dialerCard");
            hide("agentsCard");
            show("loginCard");
          }
        });

        // Connection State (handles background drops and reconnects without logging out)
        client.events.on("connection.state", (state) => {
          if (state === "connected") {
            setConnectionStatus("online", "Connected");
            log("Real-time connection established", "success");
          } else if (state === "connecting") {
            setConnectionStatus("warning", "Reconnecting...");
            log("Reconnecting to server...", "warn");
          } else if (state === "disconnected") {
            setConnectionStatus("error", "Connection lost");
            log("Real-time connection lost. Retrying in background...", "error");
          }
        });

        // Error
        client.events.on("error", (error) => {
          log(`Error [${error.code}]: ${error.message}`, "error");
          if (error.code === 500) {
            setConnectionStatus("error", "Connection lost");
          }
        });

        // 1. Instant Ring Alert via SSE (call.ring) — Shows Ringing UI Popup immediately
        client.events.on("call.ring", (ringData) => {
          const fromName =
            (typeof ringData.from === "object" && ringData.from
              ? ringData.from.name || ringData.from.number
              : ringData.from) || "Unknown";
          const fromNum =
            typeof ringData.from === "object" && ringData.from?.number
              ? ` (${ringData.from.number})`
              : "";
          const toName =
            (typeof ringData.to === "object" && ringData.to
              ? ringData.to.name || ringData.to.number
              : ringData.to) || "";

          document.getElementById("incomingCaller").textContent =
            `🔔 ${fromName}${fromNum}`;
          document.getElementById("incomingSub").textContent =
            ringData.is_transfer
              ? `Transferred call for ${toName}`
              : `Incoming call for ${toName}`;
          document.getElementById("incomingBanner").style.display = "block";

          startRingtone();

          log(
            `🔔 Instant Ring Alert from ${fromName}${fromNum}` +
              (ringData.is_transfer ? " (transfer)" : ""),
            "info",
          );
        });

        // 2. Incoming WebRTC Offer Ready (call.offer) — Binds WebRTC call object
        client.events.on("call.offer", (call) => {
          incomingCall = call;
          const label =
            call.from_name ||
            call.from ||
            call.caller ||
            call.number ||
            "Unknown";
          document.getElementById("incomingCaller").textContent = `📞 ${label}`;
          document.getElementById("incomingSub").textContent = call.isTransfer
            ? "Transferred call — WebRTC Ready"
            : "Incoming call — WebRTC Ready";
          document.getElementById("incomingBanner").style.display = "block";

          startRingtone();

          log(
            `WebRTC offer ready for call ${call.callId} from ${label}`,
            "success",
          );

          // Pre-bind state to handle CANCEL while ringing
          call.on("state", (params) => {
            if (["CANCEL", "ENDED", "ERROR"].includes(params.state)) {
              document.getElementById("incomingBanner").style.display = "none";
              incomingCall = null;
              stopRingtone();
              log(
                `Incoming call ${params.state}: ${params.reason || ""}`,
                "warn",
              );
            }
          });
        });

        // Mute notification from remote
        client.events.on("call.mute", (params) => {
          log(
            `${params.username} ${params.muted ? "muted" : "unmuted"} their mic`,
            "info",
          );
        });

        // Agent presence & lifecycle events
        client.events.on("agent.state", (params) => {
          const payload = params.data || params;
          const { id, username, state, reason } = payload;
          const agentKey = username || id;
          if (state && state !== "offline") {
            agents.set(agentKey, state);
          } else {
            agents.delete(agentKey);
          }
          renderAgents();
          log(`Agent ${agentKey} state → ${state}${reason ? ` (${reason})` : ""}`, "info");
        });

        client.events.on("agent.state.forced", (params) => {
          const payload = params.data || params;
          log(`Agent ${payload.target_username || payload.id} state forced → ${payload.new_state} by ${payload.forced_by}`, "warn");
        });

        client.events.on("agent.created", (params) => {
          const payload = params.data || params;
          log(`Agent created: ${payload.display_name || payload.username} (${payload.id})`, "info");
        });

        client.events.on("agent.updated", (params) => {
          const payload = params.data || params;
          log(`Agent updated: ${payload.display_name || payload.username} (${payload.id})`, "info");
        });

        client.events.on("agent.deleted", (params) => {
          const payload = params.data || params;
          agents.delete(payload.username || payload.id);
          renderAgents();
          log(`Agent deleted: ${payload.username || payload.id}`, "warn");
        });

        // Reconnected
        client.events.on("reconnected", (activeCalls) => {
          setConnectionStatus("online", "Reconnected");
          log(
            `Reconnected — ${activeCalls.length} active call(s) restored`,
            "success",
          );
        });
      }

      // ═══════════════════════════════════════
      // Outbound Call
      // ═══════════════════════════════════════
      async function makeCall(video = false) {
        const callee = document.getElementById("calleeInput").value.trim();
        const callerId = document.getElementById("callerIdInput").value.trim();

        if (!callee) {
          log("Destination is required", "error");
          return;
        }
        if (!client) {
          log("Client not initialized", "error");
          return;
        }

        try {
          const call = new Firetell.Call(client, {
            to: callee,
            from: callerId || undefined,
            isVideo: video,
          });

          bindCallEvents(call, callee);
          activeCall = call;

          disableDialer(true);
          log(`Calling ${callee}${video ? " (video)" : ""}…`, "info");

          await call.start();
          log(`Call started — ID: ${call.callId}`, "success");
        } catch (error) {
          log(`Call failed: ${error.message}`, "error");
          endCallUI("ERROR", error.message);
        }
      }

      // ═══════════════════════════════════════
      // Incoming Call
      // ═══════════════════════════════════════
      async function acceptIncoming() {
        if (!incomingCall) return;
        document.getElementById("incomingBanner").style.display = "none";

        const call = incomingCall;
        incomingCall = null;
        stopRingtone();

        try {
          bindCallEvents(
            call,
            call.from || call.caller || call.number || "Unknown",
          );
          activeCall = call;
          disableDialer(true);

          await call.accept();
          log("Call accepted", "success");
        } catch (error) {
          log(`Accept failed: ${error.message}`, "error");
          endCallUI("ERROR", error.message);
        }
      }

      async function rejectIncoming() {
        if (!incomingCall) return;
        document.getElementById("incomingBanner").style.display = "none";
        stopRingtone();

        try {
          await incomingCall.reject();
          log("Call rejected", "warn");
        } catch (error) {
          log(`Reject failed: ${error.message}`, "error");
        }
        incomingCall = null;
      }

      // ═══════════════════════════════════════
      // Call Event Binding
      // ═══════════════════════════════════════
      function bindCallEvents(call, peerLabel) {
        document.getElementById("callPeer").textContent = peerLabel;
        updateCallStatus("Connecting…");

        call.on("state", (params) => {
          const { state, reason } = params;
          log(`State → ${state}${reason ? ` (${reason})` : ""}`, "info");
          updateCallStatus(state);

          if (state === "RINGING") {
            updateCallStatus("Ringing…");
          }
          if (state === "ACTIVE" || state === "ANSWERED") {
            updateCallStatus("Connected");
            enableCallControls(true);
            startTimer();
          }
          if (["ENDED", "ERROR", "CANCEL"].includes(state)) {
            endCallUI(state, reason);
          }
        });

        call.on("localStream", (stream) => {
          document.getElementById("localAudio").srcObject = stream;
          if (stream) log("Local stream ready", "success");
        });

        call.on("remoteStream", (stream) => {
          document.getElementById("remoteAudio").srcObject = stream;
          if (stream) log("Remote stream ready", "success");
        });

        call.on("mediaState", (state) => {
          log(`ICE → ${state}`, state === "connected" ? "success" : "info");
        });

        call.on("mute", (params) => {
          log(`Local mic ${params.muted ? "muted" : "unmuted"}`, "info");
        });

        // Show call card
        show("callCard");
        enableCallControls(false);
      }

      // ═══════════════════════════════════════
      // Call Controls
      // ═══════════════════════════════════════
      async function hangup() {
        if (!activeCall) return;
        try {
          await activeCall.hangup();
        } catch (e) {
          log(`Hangup error: ${e.message}`, "error");
        }
      }

      async function toggleMute() {
        if (!activeCall) return;
        try {
          await activeCall.toggleMute();
          const btn = document.getElementById("muteBtn");
          btn.textContent = activeCall.isMuted ? "🔇" : "🎤";
          btn.classList.toggle("active", activeCall.isMuted);
        } catch (e) {
          log(`Mute error: ${e.message}`, "error");
        }
      }

      async function toggleHold() {
        if (!activeCall) return;
        try {
          if (activeCall.isHold) {
            await activeCall.unhold();
            log("Call resumed", "success");
          } else {
            await activeCall.onhold();
            log("Call on hold", "warn");
          }
          const btn = document.getElementById("holdBtn");
          btn.textContent = activeCall.isHold ? "▶️" : "⏸️";
          btn.classList.toggle("active", activeCall.isHold);
          updateCallStatus(activeCall.isHold ? "On Hold" : "Connected");
        } catch (e) {
          log(`Hold error: ${e.message}`, "error");
        }
      }

      function toggleDtmfPad() {
        const pad = document.getElementById("dtmfPad");
        pad.classList.toggle("hidden");
        document
          .getElementById("dtmfToggleBtn")
          .classList.toggle("active", !pad.classList.contains("hidden"));
      }

      async function sendDtmf(digit) {
        if (!activeCall) return;
        try {
          await activeCall.sendDTMF(digit);
          log(`DTMF: ${digit}`, "info");
        } catch (e) {
          log(`DTMF error: ${e.message}`, "error");
        }
      }

      async function transferCall() {
        if (!activeCall) return;
        const target = document.getElementById("transferTarget").value.trim();
        if (!target) {
          log("Transfer target required", "error");
          return;
        }
        try {
          await activeCall.transfer(target);
          log(`Transferred to ${target}`, "success");
        } catch (e) {
          log(`Transfer error: ${e.message}`, "error");
        }
      }

      function logout() {
        if (client) {
          client.logout();
          client = null;
        }
        activeCall = null;
        incomingCall = null;
        stopRingtone();
        agents.clear();
        stopTimer();
        hide("sessionCard");
        hide("dialerCard");
        hide("callCard");
        hide("agentsCard");
        show("loginCard");
        setConnectionStatus("", "Disconnected");
        log("Logged out", "warn");
      }

      // ═══════════════════════════════════════
      // UI Helpers
      // ═══════════════════════════════════════
      function endCallUI(state, reason) {
        updateCallStatus(`${state}${reason ? " — " + reason : ""}`);
        stopTimer();
        enableCallControls(false);
        activeCall = null;
        disableDialer(false);

        // Hide call card after short delay
        setTimeout(() => {
          hide("callCard");
          document.getElementById("dtmfPad").classList.add("hidden");
          document.getElementById("muteBtn").textContent = "🎤";
          document.getElementById("muteBtn").classList.remove("active");
          document.getElementById("holdBtn").textContent = "⏸️";
          document.getElementById("holdBtn").classList.remove("active");
          document.getElementById("dtmfToggleBtn").classList.remove("active");
        }, 2000);
      }

      function updateCallStatus(text) {
        document.getElementById("callStatus").textContent = text;
      }

      function enableCallControls(enabled) {
        document.getElementById("muteBtn").disabled = !enabled;
        document.getElementById("holdBtn").disabled = !enabled;
      }

      function disableDialer(disabled) {
        document.getElementById("callBtn").disabled = disabled;
        document.getElementById("videoCallBtn").disabled = disabled;
        document.getElementById("calleeInput").disabled = disabled;
      }

      function startTimer() {
        callStartTime = Date.now();
        callTimerInterval = setInterval(() => {
          const elapsed = Math.floor((Date.now() - callStartTime) / 1000);
          const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
          const s = String(elapsed % 60).padStart(2, "0");
          document.getElementById("callTimer").textContent = `${m}:${s}`;
        }, 1000);
      }

      function stopTimer() {
        if (callTimerInterval) {
          clearInterval(callTimerInterval);
          callTimerInterval = null;
        }
        document.getElementById("callTimer").textContent = "00:00";
      }

      function setConnectionStatus(state, text) {
        const dot = document.getElementById("connStatusDot");
        dot.className = "status-dot" + (state ? " " + state : "");
        document.getElementById("connStatusText").textContent = text;
      }

      async function fetchAgents() {
        const token = document.getElementById("tokenInput").value.trim();
        let baseUrl = document.getElementById("baseUrlInput").value.trim();
        if (!token || !baseUrl) return;

        try {
          if (!baseUrl.startsWith("http://") && !baseUrl.startsWith("https://")) {
            baseUrl = `https://${baseUrl}`;
          }
          const response = await fetch(`${baseUrl}/api/v1/agents?limit=100`, {
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });
          if (response.ok) {
            const result = await response.json();
            if (result && Array.isArray(result.data)) {
              agents.clear();
              for (const agent of result.data) {
                if (agent.state && agent.state !== "offline") {
                  agents.set(agent.username, agent.state);
                }
              }
              renderAgents();
            }
          }
        } catch (error) {
          log(`Failed to fetch agents: ${error.message}`, "error");
        }
      }

      function renderAgents() {
        const container = document.getElementById("agentList");
        if (agents.size === 0) {
          container.innerHTML =
            '<span class="text-muted">No agents online</span>';
          return;
        }
        const currentUser = client && client.getSessionInfo() ? client.getSessionInfo().username : "";
        container.innerHTML = Array.from(agents.entries())
          .map(([name, state]) => {
            let dotClass = "online";
            if (state === "incall") {
              dotClass = "warning";
            } else if (state === "busy") {
              dotClass = "error";
            }
            const callBtnHtml = name !== currentUser
              ? `<button class="agent-call-btn" onclick="callAgent('${name}')">📞</button>`
              : "";
            return `<span class="agent-tag" title="State: ${state}"><span class="status-dot ${dotClass}" style="width:6px;height:6px;"></span>${name}${callBtnHtml}</span>`;
          })
          .join("");
      }

      function callAgent(username) {
        document.getElementById("calleeInput").value = username;
        makeCall(false);
      }

      function show(id) {
        document.getElementById(id).classList.remove("hidden");
      }
      function hide(id) {
        document.getElementById(id).classList.add("hidden");
      }

      // ═══════════════════════════════════════
      // Logger
      // ═══════════════════════════════════════
      function log(message, type = "") {
        const panel = document.getElementById("logPanel");
        const time = new Date().toLocaleTimeString("en-US", { hour12: false });
        const entry = document.createElement("div");
        entry.className = `log-entry ${type}`;
        entry.innerHTML = `<span class="time">${time}</span> ${message}`;
        panel.appendChild(entry);
        panel.scrollTop = panel.scrollHeight;

        // Keep max 200 entries
        while (panel.children.length > 200) {
          panel.removeChild(panel.firstChild);
        }
      }

      function clearLogs() {
        document.getElementById("logPanel").innerHTML = "";
      }

      // ═══════════════════════════════════════
      // Keyboard shortcuts
      // ═══════════════════════════════════════
      document
        .getElementById("tokenInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") initClient();
        });

      document
        .getElementById("calleeInput")
        .addEventListener("keypress", (e) => {
          if (e.key === "Enter") makeCall();
        });

      // Auto-fill credentials from local storage
      const savedToken = localStorage.getItem("firetell_jwt");
      const savedDomain = localStorage.getItem("firetell_domain");
      if (savedToken) {
        document.getElementById("tokenInput").value = savedToken;
      }
      if (savedDomain) {
        document.getElementById("baseUrlInput").value = savedDomain;
      }

      // Log SDK load
      log("Firetell SDK loaded — ready to connect", "success");
    </script>
  </body>
</html>
