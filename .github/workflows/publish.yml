name: Publish Package to npmjs

# This triggers the action whenever a new release is published on GitHub
on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    steps:
      # Step 1: Download your repository code
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Set up Node.js and configure the npm registry
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      # Step 3: Install all project dependencies
      - name: Install dependencies
        run: npm ci

      # Step 4: Build your project (Optional - remove if you don't use a build step)
      - name: Build project
        run: npm run build

      # Step 5: Publish to npmjs using your hidden token
      - name: Publish to npm
        run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
